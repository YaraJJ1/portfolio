<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <meta name="description" content="My personal projects: game development in Unity & C#, graphics programming, web and desktop apps.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">Portfolio</a>

            <button class="menu-btn" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteNav">Menu</button>

            <nav class="nav" id="siteNav" aria-label="Main">
                <a href="index.html" class="active" aria-current="page">Projects</a>
                <a href="skills.html">Skills</a>
                <a href="certificates.html">Certificates</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h1>Projects</h1>
            <p>
                Here you'll find some of my work and personal projects, specializing in Unity &amp; C#.
            </p>
            <p class="summary" id="summary"></p>
        </section>

        <section class="toolbar" aria-label="Filter projects">
            <div class="tabs" role="tablist" aria-label="Category" id="categoryTabs">
                <button class="tab active" role="tab" aria-selected="true" data-filter="all">All</button>
                <button class="tab" role="tab" aria-selected="false" data-filter="games">Games</button>
                <button class="tab" role="tab" aria-selected="false" data-filter="web">Web</button>
                <button class="tab" role="tab" aria-selected="false" data-filter="backend">Back-end</button>
                <button class="tab" role="tab" aria-selected="false" data-filter="others">Others</button>
            </div>

            <div class="controls">
                <input type="search" id="searchInput" placeholder="Search" autocomplete="off" aria-label="Search projects">

                <div class="levels" role="group" aria-label="Difficulty">
                    <label><input type="checkbox" value="easy"> Easy</label>
                    <label><input type="checkbox" value="medium"> Medium</label>
                    <label><input type="checkbox" value="hard"> Hard</label>
                </div>

                <select id="sortSelect" aria-label="Sort by">
                    <option value="new-old" selected>Newest</option>
                    <option value="old-new">Oldest</option>
                    <option value="high-low">Hardest</option>
                    <option value="low-high">Easiest</option>
                </select>
            </div>
        </section>

        <p class="loading" id="loading">Loading projects…</p>

        <ul class="project-grid" id="projectGrid"></ul>

        <div class="empty" id="emptyState" hidden>
            <p>No projects match that.</p>
            <button class="link-btn" id="clearFilters">Clear filters</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="year"></span></p>
        </div>
    </footer>

    <!-- Project detail popup -->
    <div class="modal" id="projectModal" aria-hidden="true">
        <div class="modal-backdrop" data-close></div>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" data-close aria-label="Close">&times;</button>

            <div class="modal-media">
                <div class="swiper" id="modalSwiper">
                    <div class="swiper-wrapper"></div>
                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>

            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-meta" id="modalMeta"></p>
                <p class="modal-tech" id="modalTech"></p>

                <div class="modal-description" id="modalDescription"></div>

                <p class="modal-links">
                    <a id="modalGithub" target="_blank" rel="noopener noreferrer" hidden>View code on GitHub</a>
                    <button class="link-btn" id="modalShare">Copy link</button>
                </p>

                <div class="modal-nav">
                    <button class="link-btn" id="modalPrev">&larr; <span></span></button>
                    <button class="link-btn" id="modalNext"><span></span> &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script type="module" src="./script.js?v=3"></script>
</body>
</html>
