<body>
    <div id="login-container" class="login-wrapper">
        <div class="addProjectPage login-card-override">
            <h2 class="addHeader">Admin Login</h2>
            <p class="inputTitle login-label">Email:</p>
            <input type="email" id="admin-email" class="TitleT" placeholder="Enter Admin Email">

            <p class="inputTitle login-label">Password:</p>
            <input type="password" id="admin-password" class="TitleT" placeholder="Enter Password">

            <button id="login-btn" class="addProjectBtn login-btn-override">Log In</button>
        </div>
    </div>

    <div id="admin-content" style="display: none;">
        <div class="adminLayout">
            
            <div class="logout-wrapper">
                <button id="logout-btn" class="addProjectBtn logout-btn-override">Log Out</button>
            </div>

            <div class="addProjectPage">
                <h2 class="addHeader">Enter Project details: </h2>
                
                <p class="inputTitle">Enter Title: </p>
                <input type="text" class="Title" placeholder="Enter Title">

                <p class="inputTitle">Enter Description: </p>
                <textarea class="Description" placeholder="Enter Description"></textarea>
            
                <p class="inputTitle">Enter Date dd/mm/yyyy: </p>
                <input type="text" class="Date" placeholder="Enter Date">

                <div class="hero">
                    <label for="input-file" id="drop-area">
                        <input type="file" accept="image/*" id="input-file" hidden>
                        <div id="img-view">
                            <div class="upload-overlay">
                                <div class="spinner"></div>
                                <p>Uploading…</p>
                            </div>
                        </div>
                    </label>
                </div>

                <p class="inputTitle">Enter Data Category: </p>
                <select class="Category">
                    <option value="games">Games</option>
                    <option value="web">Web</option>
                    <option value="backend">Back-end</option>
                    <option value="others">Others</option>
                </select>

                <p class="inputTitle">Enter Difficulty Level: </p>
                <select class="Difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <p class="inputTitle">Enter Inner Description: </p>
                <textarea class="MoreDescription" placeholder="Enter Inner Description"></textarea>

                <p class="inputTitle">Enter All Languages Used: </p>
                <input type="text" class="Languages" placeholder="Enter Languages">
                
                <button id ="submit-project-btn" class="addProjectBtn">Add Project</button>
            </div>

            <div class="projectListSection">
                <h2 class="addHeader">Existing Projects</h2>
                <ul class="adminProjectList"></ul>
            </div>

        </div>
    </div>

    <script type="module" src="./adminScript.js"></script>
</body>
